# BALROG-RAPID MultiQC Configuration
#
# Aggregates QC reports from the integrated Nextflow pipeline.
# Files are staged into named subdirectories by the MULTIQC process;
# path_filters reference those subdirectory names.

title: "BALROG-RAPID Pipeline QC Report"
subtitle: "Metagenomic pathogen detection, host profiling, and AMR detection"

report_header_info:
  - Pipeline: "BALROG-RAPID"
  - Description: "Phase 1 QC Summary"

run_modules:
  - fastqc
  - fastp
  - bbduk
  - bowtie2
  - porechop
  - filtlong
  - nanostat
  - kraken
  - sylphtax
  - nonpareil
  - custom_content

# Use default search patterns for all modules.
# sylphtax defaults to *.sylphmpa which matches our SYLPH_TAX output.

module_order:
  - fastqc:
      name: "FastQC (Raw Reads)"
      anchor: "fastqc_raw"
      path_filters:
        - "fastqc_raw/*_fastqc.zip"
  - fastp:
      name: "FASTP (Trimming)"
      anchor: "fastp_trimming"
      path_filters:
        - "fastp/*.json"
  - bbduk:
      name: "BBDuk (Element Aviti Trimming)"
      anchor: "bbduk_trimming"
      path_filters:
        - "bbduk/*.log"
  - bowtie2:
      name: "Bowtie2 (Spike-in Removal)"
      anchor: "bowtie2_spike"
      path_filters:
        - "bowtie2_spike/*.log"
  - porechop:
      name: "Porechop_ABI (ONT Adapter Trimming)"
      anchor: "porechop_abi"
      path_filters:
        - "porechop/*_porechop.log"
  - filtlong:
      name: "Filtlong (ONT Quality/Length Filtering)"
      anchor: "filtlong_filtering"
      path_filters:
        - "filtlong/*_filtlong.log"
  - fastqc:
      name: "FastQC (Trimmed Reads)"
      anchor: "fastqc_trimmed"
      path_filters:
        - "fastqc_trimmed/*_fastqc.zip"
  - nanostat:
      name: "NanoPlot (ONT QC)"
      anchor: "nanoplot_qc"
      path_filters:
        - "nanoplot/*_NanoStats.txt"
  - kraken:
      name: "Kraken2 (Taxonomy)"
      anchor: "kraken2_taxonomy"
      path_filters:
        - "kraken2_taxonomy/*_k2report.tsv"
  - kraken:
      name: "Kraken2 (Host Profiling)"
      anchor: "kraken2_host"
      path_filters:
        - "kraken2_host/*_k2report.tsv"
  - sylphtax:
      name: "Sylph (Genome Profiling)"
      anchor: "sylph_profiling"
      path_filters:
        - "sylph/*.sylphmpa"
  - nonpareil:
      name: "Nonpareil (Coverage Estimation)"
      anchor: "nonpareil_coverage"
      path_filters:
        - "nonpareil/*.json"
  - custom_content:
      name: "SNP Profiling (Variant Details)"
      anchor: "snp_profiling_detail"
      path_filters:
        - "snp_profiling/*_snp_detail_mqc.tsv"
  - custom_content:
      name: "COI Insect ID (Detail)"
      anchor: "coi_detail"
      path_filters:
        - "coi_id/*_coi_detail_mqc.tsv"

# Clean up sample names (strip common suffixes for cleaner tables)
extra_fn_clean_exts:
  - type: "regex"
    pattern: "_trimmed_R[12]"
  - type: "regex"
    pattern: "_R[12]_001"
  - "_fastp"
  - "_k2report"
  - "_profile"
  - "_bbduk"
  - "_bowtie2_spike"
  - "_spike_removed"
  - "_spike_stats"
  - "_amrfinder_generalstats_mqc"
  - "_amrfinder_classes_mqc"
  - "_amrfinder_detail_mqc"
  - "_nonpareil"
  - "_kraken2_qc_mqc"
  - "_pc"
  - "_filtered"
  - "_NanoStats"
  - "_porechop"
  - "_filtlong"
  - "_snp_generalstats"
  - "_snp_detail"
  - "_snp_align_stats"
  - "_codon_freqs"
  - "_coi_generalstats_mqc"
  - "_coi_detail_mqc"
  - type: "regex"
    pattern: "_nanoplot$"

# General stats table: show key columns
table_columns_visible:
  "FastQC (Raw Reads)":
    percent_gc: true
    avg_sequence_length: true
    total_sequences: true
    percent_duplicates: true
    percent_fails: true
  "FastQC (Trimmed Reads)":
    percent_gc: true
    avg_sequence_length: true
    total_sequences: true
    percent_duplicates: true
    percent_fails: true
